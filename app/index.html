<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Friend - English Speaking Partner</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">AI English Partner</p>
        <h1>Friend</h1>
      </div>
      <select id="level">
        <option value="beginner">Beginner</option>
        <option value="elementary">Elementary</option>
        <option value="intermediate">Intermediate</option>
      </select>
    </header>

    <section class="hero">
      <h2>İngilizce konuş, Friend seni düzeltsin.</h2>
      <p>Yaz veya mikrofona konuş. Friend cevap verir, hatalarını gösterir ve doğru cümleyi seslendirir.</p>
    </section>

    <section id="chat" class="chat"></section>

    <section class="composer">
      <textarea id="message" placeholder="Write in English... Örn: I go to school yesterday"></textarea>

      <div class="buttons">
        <button id="micBtn" class="ghost">🎙 Konuş</button>
        <button id="sendBtn" class="primary">Gönder</button>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
